name: Publish study library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Отримати файли сайту
        uses: actions/checkout@v6
      - name: Оновити версії ресурсів, щоб браузер завантажив останню збірку
        run: |
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${GITHUB_SHA}\"|" index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${GITHUB_SHA}\"|" index.html
      - name: Налаштувати GitHub Pages
        uses: actions/configure-pages@v5
      - name: Підготувати файли сайту
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Опублікувати сайт
        id: deployment
        uses: actions/deploy-pages@v4
